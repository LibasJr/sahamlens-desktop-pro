name: Build SahamLens Pro Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Verify desktop shell
        run: npm run check

      - name: Build Tauri Desktop (.exe / .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: v__VERSION__
          releaseName: 'SahamLens Pro v__VERSION__'
          releaseBody: 'SahamLens desktop shell — always in sync with sahamlens.id'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SahamLens-Pro-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/sahamlens-desktop-pro.exe
          if-no-files-found: warn
