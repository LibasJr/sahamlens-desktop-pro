[package]
name = "sahamlens-desktop-pro"
version = "1.0.0"
description = "Secure desktop shell for SahamLens"
authors = ["SahamLens Team"]
edition = "2021"

[lib]
name = "sahamlens_desktop_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
